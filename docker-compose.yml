services:
  backend:
    build:
      context: ./backend
    image: replay-backend:latest
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      # Host-side port configurable via BACKEND_PORT (default 8000).
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: replay-frontend:latest
    ports:
      # Host-side port configurable via FRONTEND_PORT (default 8080).
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # One-shot verification: backend pytest -> frontend build -> live API
  # smoke, then exits; its container exit code is the verdict. Run with:
  #   docker compose --profile verify run --rm verify
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: replay-verify:latest
    profiles: ["verify"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
    restart: "no"
